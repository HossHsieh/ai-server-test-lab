schema_version: "0.1"

errors:
  - error_id: "E-DUT-001"
    error_code: "DUT_ID_MISSING"
    category: "DUT_IDENTITY"
    severity: "BLOCKER"
    introduced_stage: "EVT"
    status: "active"
    description: "The engineering unit ID could not be read or is missing."
    debug_hint: "Check DUT barcode, EEPROM readback, BMC inventory data, or manual unit registration."

  - error_id: "E-DUT-002"
    error_code: "BOARD_REVISION_MISSING"
    category: "DUT_IDENTITY"
    severity: "BLOCKER"
    introduced_stage: "EVT"
    status: "active"
    description: "The board revision could not be read or is missing."
    debug_hint: "Check board revision source, EEPROM content, BMC inventory data, or manual metadata entry."

  - error_id: "E-FW-001"
    error_code: "FW_BUILD_ID_MISSING"
    category: "FIRMWARE"
    severity: "MAJOR"
    introduced_stage: "EVT"
    status: "active"
    description: "The firmware build ID is missing from DUT telemetry or logs."
    debug_hint: "Check firmware image metadata, BMC query command, and debug log export path."

  - error_id: "E-FW-002"
    error_code: "FW_DEBUG_LOG_MISSING"
    category: "FIRMWARE"
    severity: "MAJOR"
    introduced_stage: "EVT"
    status: "active"
    description: "Firmware debug logs are not available for engineering investigation."
    debug_hint: "Check firmware logging configuration, log collection path, and station permission settings."

  - error_id: "E-FW-003"
    error_code: "FW_RESET_REASON_MISSING"
    category: "FIRMWARE"
    severity: "MAJOR"
    introduced_stage: "EVT"
    status: "active"
    description: "The reset reason code is unavailable."
    debug_hint: "Check reset reason register access, BMC command support, and firmware debug hooks."

  - error_id: "E-PWR-001"
    error_code: "PWR_12V_OUT_OF_RANGE"
    category: "POWER"
    severity: "CRITICAL"
    introduced_stage: "EVT"
    status: "active"
    description: "The 12V power rail is below the defined lower limit."
    debug_hint: "Check PSU, power delivery path, sensor calibration, load condition, and rail telemetry."

  - error_id: "E-PWR-002"
    error_code: "PWR_12V_TRACE_MISSING"
    category: "POWER"
    severity: "MAJOR"
    introduced_stage: "EVT"
    status: "active"
    description: "The 12V power rail trace is missing."
    debug_hint: "Check telemetry collection, sensor mapping, instrument connection, and raw trace export."

  - error_id: "E-THERM-001"
    error_code: "THERM_FAN_RAMP_TIMEOUT"
    category: "THERMAL"
    severity: "CRITICAL"
    introduced_stage: "EVT"
    status: "active"
    description: "Fan RPM did not reach the expected lower limit after the PWM command."
    debug_hint: "Check fan module, PWM command path, firmware fan control, fan part number, station airflow, and ambient temperature."

  - error_id: "E-THERM-002"
    error_code: "THERM_PACKAGE_TEMP_HIGH"
    category: "THERMAL"
    severity: "CRITICAL"
    introduced_stage: "EVT"
    status: "active"
    description: "Package temperature exceeded the defined upper limit during the thermal observability check."
    debug_hint: "Check thermal solution, fan response, load profile, heatsink contact, airflow fixture, and firmware thermal control."

  - error_id: "E-THERM-003"
    error_code: "THERM_FAN_RPM_TRACE_MISSING"
    category: "THERMAL"
    severity: "MAJOR"
    introduced_stage: "EVT"
    status: "active"
    description: "Fan RPM trace is missing."
    debug_hint: "Check tachometer readback, BMC fan telemetry, sensor mapping, and raw telemetry export."

  - error_id: "E-THERM-004"
    error_code: "THERM_PACKAGE_TEMP_TRACE_MISSING"
    category: "THERMAL"
    severity: "MAJOR"
    introduced_stage: "EVT"
    status: "active"
    description: "Package temperature trace is missing."
    debug_hint: "Check thermal sensor access, telemetry mapping, firmware support, and raw trace export."

  - error_id: "E-LOG-001"
    error_code: "LOG_CRITICAL_ERROR_FOUND"
    category: "LOG"
    severity: "CRITICAL"
    introduced_stage: "EVT"
    status: "active"
    description: "Critical errors were found in BMC or firmware logs."
    debug_hint: "Review BMC event logs, firmware error logs, reset reason code, and timestamp correlation with test phases."