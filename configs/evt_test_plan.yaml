schema_version: "0.1"

recipe:
  name: "ai_server_evt_debug_recipe"
  version: "0.1.0"
  stage: "EVT"
  mode: "debug"

metadata_schema:
  required:
    - "engineering_unit_id"
    - "board_revision"
    - "product_revision"
    - "firmware_build_id"
    - "test_script_version"
    - "bench_id"
    - "sensor_configuration"
    - "raw_telemetry_path"
    - "debug_log_path"
  optional:
    - "instrument_id"
    - "test_engineer_note"

execution_policy:
  stop_on_first_failure: false
  collect_raw_trace: true
  save_debug_logs: true
  repeat_on_failure: false
  cycle_time_target_sec: null

phases:
  - phase_name: "identify_engineering_unit"
    phase_type: "identity_check"
    enabled: true
    fail_behavior: "continue"
    measurements:
      - name: "engineering_unit_id_readback"
        type: "string"
        expected: "present"
        error_id: "E-DUT-001"
        error_code: "DUT_ID_MISSING"
      - name: "board_revision_readback"
        type: "string"
        expected: "present"
        error_id: "E-DUT-002"
        error_code: "BOARD_REVISION_MISSING"
    required_logs:
      - "engineering_unit_id"
      - "board_revision"
      - "product_revision"
      - "test_engineer_note"

  - phase_name: "firmware_debug_visibility_check"
    phase_type: "firmware_visibility_check"
    enabled: true
    fail_behavior: "continue"
    measurements:
      - name: "firmware_build_id"
        type: "string"
        expected: "present"
        error_id: "E-FW-002"
        error_code: "FW_BUILD_ID_MISSING"
      - name: "firmware_debug_log_available"
        type: "boolean"
        expected: true
        error_id: "E-FW-003"
        error_code: "FW_DEBUG_LOG_MISSING"
      - name: "reset_reason_code_available"
        type: "boolean"
        expected: true
        error_id: "E-FW-004"
        error_code: "FW_RESET_REASON_MISSING"
    required_logs:
      - "firmware_build_id"
      - "firmware_debug_log"
      - "reset_reason_code"
      - "firmware_event_log"

  - phase_name: "power_telemetry_trace_check"
    phase_type: "power_trace_check"
    enabled: true
    fail_behavior: "continue"
    stimulus:
      synthetic_load_percent: 50
      duration_sec: 30
    measurements:
      - name: "power_rail_12v_trace_available"
        type: "boolean"
        expected: true
        error_id: "E-PWR-004"
        error_code: "PWR_12V_TRACE_MISSING"
      - name: "power_rail_12v_min"
        type: "numeric"
        unit: "V"
        lower_limit: 11.60
        error_id: "E-PWR-001"
        error_code: "PWR_12V_OUT_OF_RANGE"
    required_logs:
      - "power_rail_12v_trace"
      - "power_rail_5v_trace"
      - "power_rail_3v3_trace"
      - "load_profile"
      - "raw_telemetry_path"

  - phase_name: "fan_response_debug_check"
    phase_type: "fan_response_check"
    enabled: true
    fail_behavior: "continue"
    stimulus:
      pwm_command_percent: 70
      duration_sec: 30
    measurements:
      - name: "fan_rpm_trace_available"
        type: "boolean"
        expected: true
        error_id: "E-THERM-004"
        error_code: "THERM_FAN_RPM_TRACE_MISSING"
      - name: "fan_rpm_after_pwm_70"
        type: "numeric"
        unit: "RPM"
        lower_limit: 6500
        error_id: "E-THERM-001"
        error_code: "THERM_FAN_RAMP_TIMEOUT"
    required_logs:
      - "pwm_command_trace"
      - "fan_rpm_trace"
      - "package_temperature_trace"
      - "firmware_thermal_state"
      - "fan_part_number"
      - "ambient_temperature_c"

  - phase_name: "thermal_observability_check"
    phase_type: "thermal_trace_check"
    enabled: true
    fail_behavior: "continue"
    stimulus:
      synthetic_load_percent: 80
      duration_sec: 60
    measurements:
      - name: "package_temperature_trace_available"
        type: "boolean"
        expected: true
        error_id: "E-THERM-005"
        error_code: "THERM_PACKAGE_TEMP_TRACE_MISSING"
      - name: "max_package_temperature"
        type: "numeric"
        unit: "C"
        upper_limit: 90
        error_id: "E-THERM-002"
        error_code: "THERM_PACKAGE_TEMP_HIGH"
    required_logs:
      - "package_temperature_trace"
      - "inlet_temperature_trace"
      - "outlet_temperature_trace"
      - "fan_rpm_trace"
      - "firmware_thermal_state"
      - "raw_telemetry_path"

  - phase_name: "error_log_scan_debug"
    phase_type: "error_log_scan"
    enabled: true
    fail_behavior: "continue"
    measurements:
      - name: "critical_error_count"
        type: "numeric"
        upper_limit: 0
        error_id: "E-LOG-001"
        error_code: "LOG_CRITICAL_ERROR_FOUND"
    required_logs:
      - "bmc_event_log"
      - "firmware_error_log"
      - "reset_reason_code"
      - "debug_log_path"
